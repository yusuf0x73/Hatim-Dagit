# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs: 
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: yarn install --ignore-engines && CI='' yarn build
        env:
          REACT_APP_apiKey: '${{ secrets.FIREBASE_APIKEY }}'
          REACT_APP_authDomain: '${{ secrets.FIREBASE_AUTHDOMAIN }}'
          REACT_APP_databaseURL: '${{ secrets.FIREBASE_DATABASEURL }}'
          REACT_APP_projectId: '${{ secrets.FIREBASE_PROJECTID }}'
          REACT_APP_storageBucket: '${{ secrets.FIREBASE_STORAGEBUCKET }}'
          REACT_APP_messagingSenderId: '${{ secrets.FIREBASE_MESSAGINGSENDERID }}'
          REACT_APP_appId: '${{ secrets.FIREBASE_APPID }}'
          REACT_APP_measurementId: '${{ secrets.FIREBASE_MEASUREMENTID }}'
          REACT_APP_dev: '${{ secrets.DEV_MODE }}'
          CYPRESS_DEV_MODE: '${{ secrets.DEV_MODE }}'
          SKIP_PREFLIGHT_CHECK: '${{ secrets.SKIP_PREFLIGHT_CHECK }}'
          # Lokaldeki çalıştırma ile aynı: Node 18 + eski OpenSSL (CRA 4 / webpack 4), build'de ESLint yok
          NODE_OPTIONS: '--openssl-legacy-provider'
          DISABLE_ESLINT_PLUGIN: 'true'
      # firebase-tools 12.9.1'in bağımlılığı universal-analytics@0.5.4 artık yalnızca ESM olan uuid@14 kullanıyor;
      # Node 16/18 bunu require edemiyor (ERR_REQUIRE_ESM). Deploy Node 20 ile yapılır.
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HATIM_DAGIT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECTID }}'
          firebaseToolsVersion: 12.9.1
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
          
